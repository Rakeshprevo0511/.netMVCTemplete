<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HtmlEditor demo (single file)</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  button { padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
  <h1>HtmlEditor demo — single-file version</h1>
  <div class="row">
    <button id="btnTheme">Toggle theme</button>
    <button id="btnGetHTML">Log getHTML() to console</button>
  </div>

  <div id="editor"></div>

  <!-- Only ONE file to include -->
  <script src="html-editor.bundle.js"></script>
  <script>
    const editor = HtmlEditor.create({
      element: "#editor",
      theme: "light",
      height: "560px"
    });

    let dark = false;
    document.getElementById('btnTheme').addEventListener('click', () => {
      dark = !dark;
      editor.setTheme(dark ? 'dark' : 'light');
    });
    document.getElementById('btnGetHTML').addEventListener('click', () => {
      console.log(editor.getHTML());
    });
  </script>
</body>
</html>
